name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Check output folders
        run: |
          echo "Dist:"
          ls -la dist || true
          echo "Dist client:"
          ls -la dist/client || true
          echo "Find HTML:"
          find dist -name "*.html" -type f || true

      - name: Copy index if prerendered
        run: |
          if [ -f "dist/client/index.html" ]; then
            echo "index.html found in dist/client"
          elif [ -f "dist/index.html" ]; then
            echo "Copying dist/index.html to dist/client/index.html"
            cp dist/index.html dist/client/index.html
          else
            echo "No index.html found"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
